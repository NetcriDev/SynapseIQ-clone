<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hope Neuro Data</title>
</head>

<body>

    <div class="header">
        <div class="logo-container"></div>
        <div class="logo-container-2"></div>
        
    </div>
    <main>
        <div class="container">
            <div class="table-container">
                <strong><p> Select your filters:</p></strong>
                <div class="filters">
                    <!-- <select id="filterCol7">
                        <option value="">-- All States --</option>
                    </select>
                    <select id="filterCol8">
                        <option value="">-- All Cities --</option>
                    </select> -->
                    <select id="filterSourceFolder">
                        <option value="">-- All Locations --</option>
                      </select>                      
                    <style>
                        select {
                            text-align: center;
                            text-align-last: center;
                        }
                    </style>
                    <input type="date" id="filterDate">
                    <div class="Button_CSV">
                        <button id="export-excel">Export Data</button>
                    </div>
                </div>
                
                <br> 
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th>Report N°</th>
                            <th>Crash Date</th>
                            <th>Driver Name</th>
                            <th>Age</th>
                            <th>Gender</th>
                            <th>Address</th>
                            <th>State</th>
                            <th>City</th>
                            <th>Insurance Details</th>
                            <th>Report PDF</th>
                            <th>Distance from Clinic</th>
                            <th>Phone N°</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                </table>
            </div>
            <div class="free-space" id="freeSpace" style="display: none;">
                <button onclick="hidePDF()" style="float: right; background: red; color: white; border: none; padding: 5px 10px; cursor: pointer;">X</button>
                <p><strong>ID:</strong> <span id="pdfId"></span></p>
                <!-- <iframe id="pdfViewer" src="" width="100%" height="500px" style="border: none;"></iframe> -->
                <object id="pdfViewer" type="application/pdf" width="100%" height="100%" data=""></object>
            </div>
            
            
        </div>
    </main>
</body>

<style>
    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
        font-size: 14px;
    }

    p{
        margin: 0;
        padding-bottom: 10px;
    }

    main {
            display: flex;
        }

    body {
        margin: 0;
        padding: 20px;
        padding-top: 0%;
        background-color: #57e0e02f;
    }

    .container {
        display: flex;
        gap: 20px;
        width: 100%;  /* Certifique-se de que o container ocupe a largura total */
    }

    .table-container {
        flex-grow: 1;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        max-height: 85vh;
        min-width: 0; /* Isso permitirá que a largura da div encolha */
        width: 100%;
        overflow-y:auto
    }


    .free-space {
        width: 30%;
        background: #ddd;
        padding: 20px;
        border-radius: 8px;
        text-align: center;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        display: none; /* Inicialmente escondido */
    }


    .free-space iframe {
        width: 100%;   /* Garante que o iframe ocupe 100% da largura da div */
        height: 90%;  /* Garante que o iframe ocupe 100% da altura da div */
        border: none;
    }

    .filters {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
    }

    select{
        padding: 5px;
        border-radius: 5px;
        border: 1px solid #ddd;
        background-color: #f9f9f9;
        cursor: pointer;
        border-radius: 12px;
        text-transform: uppercase; /* Coloca o texto em maiúsculas */
    }

    input{
        padding: 5px;
        border-radius: 5px;
        border: 1px solid #ddd;
        background-color: #f9f9f9;
        cursor: pointer;
        border-radius: 12px;
    }

    table {
        width: 100%;
        border-collapse: separate; /* Permite bordas arredondadas */
        border-spacing: 0; /* Remove o espaçamento entre as células */
        border-radius: 10px; /* Borda arredondada para a tabela */
        overflow: hidden; /* Garante que o conteúdo não ultrapasse as bordas arredondadas */
        text-transform: uppercase; /* Coloca o texto em maiúsculas */
    }

    th, td {
        border: 1px solid #ddd; /* Borda nas células */
        padding: 8px;
        text-align: center;
    }

    th {
        background-color: #f0f0f0;
        /* background-color:  #ddd; */
    }
    /* Arredondar as bordas das células também */
    table tr:first-child th:first-child {
        border-top-left-radius: 10px;
    }

    table tr:first-child th:last-child {
        border-top-right-radius: 10px;
    }

    table tr:last-child td:first-child {
        border-bottom-left-radius: 10px;
    }

    table tr:last-child td:last-child {
        border-bottom-right-radius: 10px;
    }

    /* ------------------- Right Top Menu ------------------- */

    .menu {
        display: flex;
        gap: 20px;
        justify-content: flex-end;
        align-items: flex-end;
        width: 100%;
    }

    .header {
        width: 100%;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
        display: flex;
        padding: 10px 20px;
        /* border-bottom: 1px solid #ddd; */
        margin-bottom: 10px;
        justify-content: space-between; /* Coloca os logos nas extremidades */
        align-items: center; /* Alinha os logos verticalmente */
    }

    a[slot="primary-items"]::after {
        content: '|';
        position: absolute;
        right: -0.25em; /* == -4px */
        color: hwb(0 69% 31%);
    }

    .logo-container {
        width: 250px;
        height: 50px;
        background-size: contain;
        background-repeat: no-repeat;
        background-image: url("./images/rel8ed_logo_v2.png");
    }

    .logo-container-2 {
        width: 250px;
        height: 50px;
        background-size: contain;
        background-repeat: no-repeat;
        background-image: url("./images/Hope-Neuro_Logo.png");
        flex-grow: 0;
    }
    
    button {
        font-size: 14px;
        font-weight: bold;
        border: 2px solid #57e0e02f;
        background-color: #57e0e02f;
        padding: 5px;
        border-radius: 5px;
        cursor: pointer;
        border-radius: 12px;
        /* width: 120%; */
    }

    button:hover{
        background-color: #57e0e02f;
        color: rgba(141, 134, 134, 0.281);
    }

</style>

<script>
    const API_URL = "https://990c-52-116-202-144.ngrok-free.app/incident/search";
    let data = [];

    async function buscarIncidentes() {
        try {
            const resposta = await fetch(API_URL, {
                headers: { "ngrok-skip-browser-warning": "true" }
            });

            if (!resposta.ok) throw new Error(`Erro: ${resposta.status}`);

            const dados = await resposta.json();
            data = transformarDados(dados);
            renderTable();
        } catch (erro) {
            console.error("Erro ao buscar incidentes:", erro);
            document.getElementById("resultados").innerHTML = `<p style="color:red;">Erro ao carregar dados.</p>`;
        }
    }

    function transformarDados(dados) {
        let incidentesFormatados = [];

        dados.forEach(incidente => {
            const folder = incidente.original_document_location?.split("/")[3] || "--";

            incidente.vehicles.forEach(veiculo => {
                const motorista = veiculo.passengers?.find(p => p.role === "Driver") || {};
                const driverName = motorista.name || veiculo.driver_name || "--";
                const insuranceDetails = veiculo.insurance_company ? ` <br> Insurance Company: ${veiculo.insurance_company}` : "Insurance Company: N/A";
                const driverLicense = veiculo.driver_license ? ` <br> License: ${veiculo.driver_license}` : "";
                const policyNumber = veiculo.policy_number ? ` <br> Policy: ${veiculo.policy_number}` : "";

                if (["Unknown", "--", "UNKNOWN"].includes(driverName) || insuranceDetails === "N/A") return;

                incidentesFormatados.push({
                    id: incidente.report_number,
                    col2: incidente.accident_datetime.split("T")[0],
                    col3: driverName,
                    col4: motorista.age || "--",
                    col5: motorista.gender || "--",
                    col6: veiculo.owner_address || "--",
                    col7: incidente.state || "--",
                    col8: incidente.city || "--",
                    col9: (insuranceDetails + driverLicense + policyNumber) || "--",
                    col10: `https://990c-52-116-202-144.ngrok-free.app/incident/pdf/view/${incidente.pdf_id || incidente.report_number}`,
                    col11: "--",
                    col12: motorista.phone1 || "--",
                    sourceFolder: folder
                });
            });
        });

        incidentesFormatados.sort((a, b) => new Date(b.col2) - new Date(a.col2));
        return incidentesFormatados;
    }


    function renderTable() {
        const tableBody = document.getElementById("tableBody");
        const filterFolder = document.getElementById("filterSourceFolder").value;
        const filterDate = document.getElementById("filterDate").value;

        tableBody.innerHTML = "";

        data
            .filter(item =>
                (!filterFolder || item.sourceFolder === filterFolder) &&
                (!filterDate || item.col2 === filterDate) &&
                (item.col4 === "--" || (parseInt(item.col4) >= 18))
            )
            .forEach(item => {
                const linkIcon = item.col10
                    ? `<a href="#" onclick="viewPDF('${item.col10}', '${item.id}')" title="Ver relatório">🔗</a>`
                    : "";

                const row = `<tr>
                    <td>${item.id}</td>
                    <td>${item.col2}</td>
                    <td>${item.col3}</td>
                    <td>${item.col4}</td>
                    <td>${item.col5}</td>
                    <td>${item.col6}</td>
                    <td>${item.col7}</td>
                    <td>${item.col8}</td>
                    <td>${item.col9}</td>
                    <td>${linkIcon}</td>
                    <td>${item.col11}</td>
                    <td>${item.col12}</td>
                </tr>`;
                tableBody.innerHTML += row;
            });
    }

    async function carregarFiltros() {
        try {
            const resposta = await fetch(API_URL, {
                headers: { "ngrok-skip-browser-warning": "true" }
            });

            if (!resposta.ok) throw new Error(`Erro: ${resposta.status}`);

            const dados = await resposta.json();
            const incidentesTransformados = transformarDados(dados);

            const folders = [...new Set(incidentesTransformados.map(i => i.sourceFolder))].sort();

            const filterSourceFolder = document.getElementById("filterSourceFolder");
            filterSourceFolder.innerHTML = '<option value="">-- All Locations --</option>';

            folders.forEach(folder => {
                const option = new Option(folder, folder);
                filterSourceFolder.appendChild(option);
            });

            document.getElementById("filterSourceFolder").addEventListener("change", renderTable);
        } catch (erro) {
            console.error("Erro ao carregar filtros:", erro);
            document.getElementById("resultados").innerHTML = `<p style="color:red;">Erro ao carregar filtros.</p>`;
        }
    }


    function atualizarFiltros(dadosFiltrados) {
        const estados = new Set();
        const cidades = new Set();

        dadosFiltrados.forEach(incidente => {
            if (incidente.state) estados.add(incidente.state.trim());
            if (incidente.city) cidades.add(incidente.city.trim());
        });

        const filterCol7 = document.getElementById("filterCol7");
        const filterCol8 = document.getElementById("filterCol8");

        filterCol7.innerHTML = '<option value="">-- All States --</option>';
        filterCol8.innerHTML = '<option value="">-- All Cities --</option>';

        [...estados].sort().forEach(estado => {
            const option = new Option(estado, estado);
            filterCol7.appendChild(option);
        });

        [...cidades].sort().forEach(cidade => {
            const option = new Option(cidade, cidade);
            filterCol8.appendChild(option);
        });
    }

    function filtrarPorEstado() {
        const estado = document.getElementById("filterCol7").value;
        const dadosFiltrados = estado
            ? todosOsDados.filter(inc => inc.state === estado)
            : todosOsDados;
        atualizarFiltros(dadosFiltrados);
        document.getElementById("filterCol7").value = estado;
    }

    function filtrarPorCidade() {
        const cidade = document.getElementById("filterCol8").value;
        const dadosFiltrados = cidade
            ? todosOsDados.filter(inc => inc.city === cidade)
            : todosOsDados;
        atualizarFiltros(dadosFiltrados);
        document.getElementById("filterCol8").value = cidade;
    }

    function viewPDF(url, id) {
        document.getElementById("pdfViewer").data = url;
        document.getElementById("pdfId").textContent = id;

        const freeSpace = document.getElementById("freeSpace");
        const tableContainer = document.querySelector(".table-container");

        freeSpace.style.display = "block";
        freeSpace.style.width = "30%";
        tableContainer.style.width = "70%";
        freeSpace.style.transition = "width 0.3s ease, opacity 0.3s ease";
        tableContainer.style.transition = "width 0.3s ease";
        freeSpace.style.opacity = "1";
    }

    function hidePDF() {
        const freeSpace = document.getElementById("freeSpace");
        const tableContainer = document.querySelector(".table-container");

        freeSpace.style.transition = "width 0.3s ease, opacity 0.3s ease";
        tableContainer.style.transition = "width 0.3s ease";

        freeSpace.style.width = "0";
        freeSpace.style.opacity = "0";

        setTimeout(() => {
            freeSpace.style.display = "none";
            tableContainer.style.width = "100%";
        }, 300);
    }

    function downloadCSV() {
        const filterCol7 = document.getElementById("filterCol7").value;
        const filterCol8 = document.getElementById("filterCol8").value;
        const filterDate = document.getElementById("filterDate").value;

        const filteredData = data.filter(item =>
            (!filterCol7 || item.col7 === filterCol7) &&
            (!filterCol8 || item.col8 === filterCol8) &&
            (!filterDate || item.col2 === filterDate)
        );

        if (!filteredData.length) {
            alert("Nenhum dado filtrado disponível para exportar");
            return;
        }

        const headers = [
            "Report Number", "Date", "Driver Name", "Age", "Gender",
            "Owner Address", "State", "City", "Insurance Details",
            "Report URL", "Additional Info", "Phone"
        ];

        const csvRows = filteredData.map(item => [
            item.id, item.col2, item.col3, item.col4, item.col5, item.col6,
            item.col7, item.col8, item.col9, item.col10, item.col11, item.col12
        ].map(value => `"${value}"`).join(','));

        const csvContent = [headers.join(','), ...csvRows].join('\n');

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', 'filtered_incident_report.csv');
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // Eventos iniciais
    document.addEventListener("DOMContentLoaded", () => {
        carregarFiltros();
        buscarIncidentes();
        document.getElementById("export-excel").addEventListener("click", downloadCSV);
        document.getElementById("filterCol7").addEventListener("change", renderTable);
        document.getElementById("filterCol8").addEventListener("change", renderTable);
        document.getElementById("filterDate").addEventListener("change", renderTable);
    });
</script>


</html>
