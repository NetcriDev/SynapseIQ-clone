<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hope Neuro Data</title>
</head>

<body>

    <div class="header">
        <div class="logo-container"></div>
        <div class="logo-container-2"></div>
        
    </div>
    <main>
        <div class="container">
            <div class="table-container">
                <strong><p> Select your filters:</p></strong>
                <div class="filters">
                    <select id="filterCol7">
                        <option value="">-- State --</option>
                    </select>
                    <select id="filterCol8">
                        <option value="">-- City --</option>
                    </select>
                    <style>
                        select {
                            text-align: center;
                            text-align-last: center;
                        }
                    </style>
                    <input type="date" id="filterDate">
                    <div class="Button_CSV">
                        <button id="export-excel">Export Data</button>
                    </div>
                </div>
                
                <br> 
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th>Report N°</th>
                            <th>Crash Date</th>
                            <th>Driver Name</th>
                            <th>Age</th>
                            <th>Gender</th>
                            <th>Address</th>
                            <th>State</th>
                            <th>City</th>
                            <th>Insurance Details</th>
                            <th>Report PDF</th>
                            <th>Distance from Clinic</th>
                            <th>Phone N°</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                </table>
            </div>
            <div class="free-space" id="freeSpace" style="display: none;">
                <button onclick="hidePDF()" style="float: right; background: red; color: white; border: none; padding: 5px 10px; cursor: pointer;">X</button>
                <p><strong>ID:</strong> <span id="pdfId"></span></p>
                <iframe id="pdfViewer" src="" width="100%" height="500px" style="border: none;"></iframe>
            </div>
            
            
        </div>
    </main>
</body>

<style>
    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
        font-size: 14px;
    }

    p{
        margin: 0;
        padding-bottom: 10px;
    }

    main {
            display: flex;
        }

    body {
        margin: 0;
        padding: 20px;
        padding-top: 0%;
        background-color: #57e0e02f;
    }

    .container {
        display: flex;
        gap: 20px;
        width: 100%;  /* Certifique-se de que o container ocupe a largura total */
    }

    .table-container {
        flex-grow: 1;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        max-height: 85vh;
        min-width: 0; /* Isso permitirá que a largura da div encolha */
        width: 100%;
        overflow-y:auto
    }


    .free-space {
        width: 30%;
        background: #ddd;
        padding: 20px;
        border-radius: 8px;
        text-align: center;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        display: none; /* Inicialmente escondido */
    }


    .free-space iframe {
        width: 100%;   /* Garante que o iframe ocupe 100% da largura da div */
        height: 90%;  /* Garante que o iframe ocupe 100% da altura da div */

    }

        display: flex;
        gap: 10px;
        margin-bottom: 10px;
    }

    select{
        padding: 5px;
        border-radius: 5px;
        border: 1px solid #ddd;
        background-color: #f9f9f9;
        cursor: pointer;
        border-radius: 12px;
    }

    input{
        padding: 5px;
        border-radius: 5px;
        border: 1px solid #ddd;
        background-color: #f9f9f9;
        cursor: pointer;
        border-radius: 12px;
    }

    table {
        width: 100%;
        border-collapse: separate; /* Permite bordas arredondadas */
        border-spacing: 0; /* Remove o espaçamento entre as células */
        border-radius: 10px; /* Borda arredondada para a tabela */
        overflow: hidden; /* Garante que o conteúdo não ultrapasse as bordas arredondadas */
    }

    th, td {
        border: 1px solid #ddd; /* Borda nas células */
        padding: 8px;

    }

    th {
        background-color: #f0f0f0;
        /* background-color:  #ddd; */
    }
    /* Arredondar as bordas das células também */
    table tr:first-child th:first-child {
        border-top-left-radius: 10px;
    }

    table tr:first-child th:last-child {
        border-top-right-radius: 10px;
    }

    table tr:last-child td:first-child {
        border-bottom-left-radius: 10px;
    }

    table tr:last-child td:last-child {
        border-bottom-right-radius: 10px;
    }

    /* ------------------- Right Top Menu ------------------- */

    .menu {
        display: flex;
        gap: 20px;
        justify-content: flex-end;
        align-items: flex-end;
        width: 100%;
    }

    .header {
        width: 100%;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
        display: flex;
        padding: 10px 20px;
        /* border-bottom: 1px solid #ddd; */
        margin-bottom: 10px;
        justify-content: space-between; /* Coloca os logos nas extremidades */
        align-items: center; /* Alinha os logos verticalmente */
    }

    a[slot="primary-items"]::after {
        content: '|';

        width: 250px;
        height: 50px;
        background-size: contain;
        background-repeat: no-repeat;
        background-image: url("./images/rel8ed_logo_v2.png");
    }

    .logo-container-2 {
        width: 250px;
        height: 50px;
        background-size: contain;
        background-repeat: no-repeat;
        background-image: url("./images/Hope-Neuro_Logo.png");
        flex-grow: 0;
    }
    
    button {
        font-size: 14px;
        font-weight: bold;
        border: 2px solid #57e0e02f;
        background-color: #57e0e02f;

        border-radius: 5px;
        cursor: pointer;
        border-radius: 12px;
        /* width: 120%; */
    }

    button:hover{
        background-color: #57e0e02f;
        color: rgba(141, 134, 134, 0.281);
    }

</style>

<script>
    const API_URL = "https://990c-52-116-202-144.ngrok-free.app/incident/search";
    let data = []; // Variável global para armazenar os incidentes

    // Função para buscar os dados da API e armazená-los globalmente
    async function buscarIncidentes() {
        try {
            const resposta = await fetch(API_URL, {
                headers: { "ngrok-skip-browser-warning": "true" }
            });

            if (!resposta.ok) {
                throw new Error(`Erro: ${resposta.status}`);
            }

            const dados = await resposta.json();
            data = transformarDados(dados); // Salva os dados na variável global
            renderTable(); // Agora chamamos a renderização após os dados estarem carregados
        } catch (erro) {
            console.error("Erro ao buscar incidentes:", erro);
            document.getElementById("resultados").innerHTML = `<p style="color:red;">Erro ao carregar dados.</p>`;
        }
    }

    // Função para transformar os dados da API no formato correto para a tabela
    function transformarDados(dados) {
        let incidentesFormatados = [];

        dados.forEach(incidente => {
            incidente.vehicles.forEach(veiculo => {
                const motorista = veiculo.passengers?.find(p => p.role === "Driver") || {};

                let driverName = motorista.name || veiculo.driver_name || "--";
                let insuranceDetails = veiculo.insurance_company || "--";
                let driverLicense = veiculo.driver_license ? ` (License: ${veiculo.driver_license})` : "";
                
                // Exclui linhas
                if (driverName === "Unknown" || driverName === "--" || driverName === "UNKNOWN" || insuranceDetails === "N/A") {  // motorist.age<18
                    return; // Pula essa iteração e não adiciona ao array
                }
                
                incidentesFormatados.push({
                    id: incidente.report_number,
                    col2: incidente.accident_datetime.split("T")[0], // Data do acidente
                    col3: motorista.name || veiculo.driver_name || "--", // Nome do motorista
                    col4: motorista.age || "--", // Idade
                    col5: motorista.gender || "--", // Gênero
                    col6: veiculo.owner_address || "--", // Endereço do proprietário
                    col7: incidente.state || "--", // Estado
                    col8: incidente.city || "--", // Cidade
                    col9: insuranceDetails + driverLicense || "--", // Seguradora + Licença
                    col10: incidente.source_url || "--", // Link do relatório
                    col11: "--", // Pode ser ajustado conforme necessidade
                    col12: motorista.phone1 || "--" // Telefone
                });
                
                
                // exlui linha da tabela quandi igual "--"
                // incidentesFormatados = incidentesFormatados.filter(item => item.col4 !== "--");

                // retira a string "Insurance" do conteudo da coluna Insuranse Details
                incidentesFormatados.forEach(item => {
                    if (item.col9.includes("Insurance")) {
                        item.col9 = item.col9.replace("Insurance", "").trim();
                    }
                });

                
            });
        });

        // Ordena os incidentes por data em ordem decrescente
        incidentesFormatados.sort((a, b) => new Date(b.col2) - new Date(a.col2));
        dataTable = incidentesFormatados
        return incidentesFormatados;
    }

    // Função para renderizar a tabela com os dados filtrados
    function renderTable() {
        const tableBody = document.getElementById("tableBody");
        const filterCol7 = document.getElementById("filterCol7");
        const filterCol8 = document.getElementById("filterCol8");
        const filterDate = document.getElementById("filterDate");

        tableBody.innerHTML = "";

        data
            .filter(item =>
                (!filterCol7.value || item.col7 === filterCol7.value) &&
                (!filterCol8.value || item.col8 === filterCol8.value) &&
                (!filterDate.value || item.col2 === filterDate.value)
            )
            .forEach(item => {
                // const linkIcon = item.col10 
                //     ? `<a href="#" onclick="window.open('${item.col10}', '_blank')" title="Ver relatório">🔗</a>` 
                //     : "";
                const linkIcon = item.col10 
                    ? `<a href="#" onclick="viewPDF('${item.col10}', '${item.id}')" title="Ver relatório">🔗</a>` 
                    : "";

                const row = `<tr>
                    <td>${item.id}</td>
                    <td>${item.col2}</td>
                    <td>${item.col3}</td>
                    <td>${item.col4}</td>
                    <td>${item.col5}</td>
                    <td>${item.col6}</td>
                    <td>${item.col7}</td>
                    <td>${item.col8}</td>
                    <td>${item.col9}</td>
                    <td>${linkIcon}</td>
                    <td>${item.col11}</td>
                    <td>${item.col12}</td>
                </tr>`;
                tableBody.innerHTML += row;
            });
    }

    // Função para buscar dados da API e popular filtros
    async function carregarFiltros() {
        try {
            const resposta = await fetch(API_URL, {
                headers: {
                    "ngrok-skip-browser-warning": "true"
                }
            });

            if (!resposta.ok) {
                throw new Error(`Erro: ${resposta.status}`);
            }

            const dados = await resposta.json();
            todosOsDados = dados; // Armazena os dados

            atualizarFiltros(dados); // Popula inicialmente todos os filtros

            // Adiciona eventos aos selects
            document.getElementById("filterCol7").addEventListener("change", filtrarPorEstado);
            document.getElementById("filterCol8").addEventListener("change", filtrarPorCidade);
            
        } catch (erro) {
            console.error("Erro ao carregar filtros:", erro);
            document.getElementById("resultados").innerHTML = `<p style="color:red;">Erro ao carregar filtros.</p>`;
        }
        
        
    }

    function atualizarFiltros(dadosFiltrados) {
        const estados = new Set();
        const cidades = new Set();

        dadosFiltrados.forEach(incidente => {
            if (incidente.state && incidente.state.trim() !== "") {
                estados.add(incidente.state.trim());
            }
            if (incidente.city && incidente.city.trim() !== "") {
                cidades.add(incidente.city.trim());
            }
        });

         // Converte para arrays e ordena alfabeticamente
        const estadosOrdenados = Array.from(estados).sort((a, b) => a.localeCompare(b));
        const cidadesOrdenadas = Array.from(cidades).sort((a, b) => a.localeCompare(b));

        const filterCol7 = document.getElementById("filterCol7");
        const filterCol8 = document.getElementById("filterCol8");

        // Limpa os selects
        filterCol7.innerHTML = '<option value="">-- State --</option>';
        filterCol8.innerHTML = '<option value="">-- City --</option>';

        estadosOrdenados.forEach(estado => {
            const option = document.createElement("option");
            option.value = estado;
            option.textContent = estado;
            filterCol7.appendChild(option);
        });

        cidadesOrdenadas.forEach(cidade => {
            const option = document.createElement("option");
            option.value = cidade;
            option.textContent = cidade;
            filterCol8.appendChild(option);
        });
    }

    function filtrarPorEstado() {
        const estadoSelecionado = document.getElementById("filterCol7").value;

        const dadosFiltrados = estadoSelecionado
            ? todosOsDados.filter(inc => inc.state === estadoSelecionado)
            : todosOsDados;

        atualizarFiltros(dadosFiltrados);

        // Mantém o estado selecionado após repopular
        document.getElementById("filterCol7").value = estadoSelecionado;
    }

    function filtrarPorCidade() {
        const cidadeSelecionada = document.getElementById("filterCol8").value;

        const dadosFiltrados = cidadeSelecionada
            ? todosOsDados.filter(inc => inc.city === cidadeSelecionada)
            : todosOsDados;

        atualizarFiltros(dadosFiltrados);

        // Mantém a cidade selecionada após repopular
        document.getElementById("filterCol8").value = cidadeSelecionada;
    }

    // Exibir o PDF na "free-space"
    function viewPDF(url, id) {
        document.getElementById("pdfViewer").src = url;
        document.getElementById("pdfId").textContent = id;

        const freeSpace = document.getElementById("freeSpace");
        const tableContainer = document.querySelector(".table-container");

        freeSpace.style.display = "block"; 
        freeSpace.style.width = "30%";  
        tableContainer.style.width = "70%"; 

        // Adiciona transições para suavizar a abertura
        freeSpace.style.transition = "width 0.3s ease, opacity 0.3s ease";
        tableContainer.style.transition = "width 0.3s ease";

        // Define a opacidade para tornar a div visível
        freeSpace.style.opacity = "1";
    }

    function hidePDF() {
        const freeSpace = document.getElementById("freeSpace");
        const tableContainer = document.querySelector(".table-container");

        // Adiciona transições para suavizar o fechamento
        freeSpace.style.transition = "width 0.3s ease, opacity 0.3s ease";
        tableContainer.style.transition = "width 0.3s ease";

        // Define a largura e opacidade para o fechamento suave
        freeSpace.style.width = "0";
        freeSpace.style.opacity = "0";

        // Aguarda a transição antes de esconder completamente a div
        setTimeout(() => {
            freeSpace.style.display = "none";
            tableContainer.style.width = "100%";
        }, 300); // Tempo correspondente à duração da transição
    }

    function downloadCSV() {
        // Obtém os valores dos filtros atuais
        const filterCol7 = document.getElementById("filterCol7").value;
        const filterCol8 = document.getElementById("filterCol8").value;
        const filterDate = document.getElementById("filterDate").value;

        // Aplica os mesmos filtros que a renderTable() usa
        const filteredData = dataTable.filter(item =>
            (!filterCol7 || item.col7 === filterCol7) &&
            (!filterCol8 || item.col8 === filterCol8) &&
            (!filterDate || item.col2 === filterDate)
        );

        // Verifica se há dados filtrados para exportar
        if (!filteredData || filteredData.length === 0) {
            alert("Nenhum dado filtrado disponível para exportar");
            return;
        }

        // Cabeçalhos do CSV
        const headers = [
            "Report Number",
            "Date",
            "Driver Name",
            "Age",
            "Gender",
            "Owner Address",
            "State",
            "City",
            "Insurance Details",
            "Report URL",
            "Additional Info",
            "Phone"
        ];

        // Mapeia os dados filtrados para as linhas do CSV
        const csvRows = filteredData.map(item => {
            return [
                `"${item.id}"`,
                `"${item.col2}"`,
                `"${item.col3}"`,
                `"${item.col4}"`,
                `"${item.col5}"`,
                `"${item.col6}"`,
                `"${item.col7}"`,
                `"${item.col8}"`,
                `"${item.col9}"`,
                `"${item.col10}"`,
                `"${item.col11}"`,
                `"${item.col12}"`
            ].join(',');
        });

        // Junta cabeçalhos e dados
        const csvContent = [
            headers.join(','),
            ...csvRows
        ].join('\n');

        // Cria o blob e o link para download
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', 'filtered_incident_report.csv');
        link.style.visibility = 'hidden';
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }



    filterCol7.addEventListener("change", renderTable);
    filterCol8.addEventListener("change", renderTable);
    filterDate.addEventListener("change", renderTable);
    document.addEventListener("DOMContentLoaded", buscarIncidentes);
    // Adiciona o evento ao botão de exportação
    document.getElementById("export-excel").addEventListener("click", downloadCSV);

    // Chama a função de carregamento de filtros e incidentes ao carregar a página
    document.addEventListener("DOMContentLoaded", () => {
        carregarFiltros();
        buscarIncidentes();
    });

    renderTable();

</script>

</html>
