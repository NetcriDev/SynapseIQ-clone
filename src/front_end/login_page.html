<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Hope Neuro</title>
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <img src="./images/Hope-Neuro_Logo.png" alt="Logo" class="logo">
      <h2>Crash Reports</h2>
      <form>
        <div class="input-group">
          <!-- <span class="icon">📧</span> -->
          <input type="email" placeholder="yours@example.com" required>
        </div>
        <div class="input-group">
          <!-- <span class="icon">🔒</span> -->
          <input type="password" placeholder="your password" required>
        </div>
        <p class="forgot">Don't remember your password?</p>
        <button type="submit">LOG IN ➤</button>
      </form>
    </div>
    <!-- <div class="auth0-tag">Protected with <span class="auth0-icon">🛡️</span> Auth0</div> -->
  </div>
</body>

<style>
    body {
        margin: 0;
        background: #777;
        font-family: Arial, sans-serif;
    }

    .login-container {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
    }

    .login-box {
        background: white;
        padding: 2rem;
        border-radius: 6px;
        box-shadow: 0px 0px 20px rgba(0,0,0,0.4);
        width: 300px;
        text-align: center;
    }

    .logo {
        width: 150px;
        margin-bottom: 30px;
    }

    h2 {
        margin-bottom: 60px;
        color: #444;
    }

    .input-group {
        display: flex;
        align-items: center;
        background: #f5f5f5;
        padding: 0.5rem;
        margin-bottom: 15px;
        border-radius: 4px;
    }

    .input-group .icon {
        margin-right: 10px;
    }

    .input-group input {
        border: none;
        background: transparent;
        outline: none;
        flex: 1;
        font-size: 14px;
    }

    .forgot {
        font-size: 12px;
        margin-bottom: 20px;
        color: #444;
    }

    button {
        background: #009c95;
        color: white;
        border: none;
        padding: 10px 20px;
        width: 100%;
        font-weight: bold;
        font-size: 14px;
        cursor: pointer;
        border-radius: 2px;
    }


</style>

</html>
