<script>
    let data = [];
    let selectedItems = new Set();

    function transformData(dados) {
        let incidentesFormatados = [];

        dados.forEach(incidente => {
            const caminho = incidente.original_document_location?.replace(/\\/g, "/");
            const partes = caminho?.split("/");
            const folder = partes?.[3] || "--";

            incidente.vehicles.forEach(veiculo => {
                const motorista = veiculo.passengers?.find(p => p.role === "Driver") || {
                    name: veiculo.driver_name,
                    first_name: veiculo.driver_first_name,
                    middle_name: veiculo.driver_middle_name,
                    last_name: veiculo.driver_last_name,
                    phone2: null,
                    age: "--",
                    gender: "--"
                };

                const phones = (motorista.phone2 || "").split(",").map(p => p.trim());
                const phoneA = phones[0] || "";
                const phoneB = phones[1] || "";

                const nameParts = [
                    motorista.first_name,
                    motorista.middle_name,
                    motorista.last_name
                ].filter(part => part && part.trim() !== "");

                const driverName = nameParts.length > 0 
                    ? nameParts.join(" ") 
                    : motorista.name || "--";

                const insuranceDetails = veiculo.insurance_company ? `Insurance Company: ${veiculo.insurance_company}` : "--";
                const driverLicense = veiculo.driver_license ? ` <br> License: ${veiculo.driver_license}` : "";
                const policyNumber = veiculo.policy_number ? ` <br> Policy: ${veiculo.policy_number}` : "";

                const nearestHopeMiles = incidente.nearest_hope_d ? ` Miles: ${incidente.nearest_hope_d}` : "";
                const nearesHopeCenter = incidente.name_nearest_hope ? ` <br> Center: ${incidente.name_nearest_hope}` : "";

                if (["Unknown", "--", "UNKNOWN", "N/A"].some(term => driverName.includes(term))) return;

                incidentesFormatados.push({
                    id: incidente.report_number,
                    col2: incidente.accident_datetime.split("T")[0],
                    col3: driverName,
                    phoneA: phoneA,  
                    phoneB: phoneB,  
                    col5: (insuranceDetails + driverLicense + policyNumber) || "--",
                    col6: incidente.crash_severity || "--",
                    col7: motorista.age || "--",
                    col8: motorista.gender || "--",
                    col9: veiculo.owner_address || "--",  // incidente.street || 
                    col10: incidente.state || "--",
                    col11: incidente.city || "--",
                    col12: `https://8162-52-116-202-144.ngrok-free.app/incident/pdf/view/${incidente.pdf_id || incidente.report_number}`,
                    col13: (nearestHopeMiles + nearesHopeCenter) || "--",
                    sourceFolder: folder,
                    original: incidente,
                    passengerId: motorista.id,
                }); 

            });
        });

        return incidentesFormatados.sort((a, b) => {
            const aPhoneValid = 
                ((a.phoneA && a.phoneA !== "--" && a.phoneA.replace(/[, ]/g, '') !== "") || 
                (a.phoneB && a.phoneB !== "--" && a.phoneB.replace(/[, ]/g, '') !== ""));
            const bPhoneValid = 
                ((b.phoneA && b.phoneA !== "--" && b.phoneA.replace(/[, ]/g, '') !== "") || 
                (b.phoneB && b.phoneB !== "--" && b.phoneB.replace(/[, ]/g, '') !== ""));

            // 1st sort by phone validity
            if (aPhoneValid !== bPhoneValid) {
                return bPhoneValid - aPhoneValid;
            }
            
            // 2nd sort by insurance validity
            const aHasInsurance = a.col5 !== "--";
            const bHasInsurance = b.col5 !== "--";

            if (aHasInsurance !== bHasInsurance) {
                return bHasInsurance - aHasInsurance;
            }

            // 3rd sort by date
            return new Date(b.col2) - new Date(a.col2);
        });

    }


    // Modificar a função de renderTable para usar os filtros corretamente
    function renderTable() {
        const tableBody = document.getElementById("tableBody");
        const filterFolder = document.getElementById("filterSourceFolder").value;
        const filterDate = document.getElementById("filterDate").value;
        const filterCol10 = document.getElementById("filterCol10").value;
        const filterCol11 = document.getElementById("filterCol11").value;

        // Atualiza a variável global
        filteredData = data.filter(item =>
            (!filterFolder || item.sourceFolder === filterFolder) &&
            (!filterDate || item.col2 === filterDate) &&
            (isNaN(parseInt(item.col7)) || parseInt(item.col7) >= 18) &&
            (!filterCol10 || item.col10 === filterCol10) &&
            (!filterCol11 || item.col11 === filterCol11)
        );

        const totalPages = Math.ceil(filteredData.length / rowsPerPage);
        currentPage = Math.min(currentPage, totalPages || 1);
        const start = (currentPage - 1) * rowsPerPage;
        const end = start + rowsPerPage;

        tableBody.innerHTML = "";

        filteredData.slice(start, end).forEach((item, index) => {
            const itemString = escapeHtml(JSON.stringify(item));
            // const linkIcon = item.col12 ? `<a href="#" onclick="viewPDF('${item.col12}', '${item.id}')">🔗</a>` : "";
            const linkIcon = item.col12 && item.col10?.toLowerCase() !== "minnesota"
                ? `<a href="#" onclick="viewPDF('${item.col12}', '${item.id}')">🔗</a>`
                : `<span style="color: gray;">--</span>`;


            // Verifica se a linha é um "hot lead"
            const isHotLead = 
                (
                    (item.phoneA && item.phoneA !== "--" && item.phoneA.replace(/[, ]/g, '') !== "") || 
                    (item.phoneB && item.phoneB !== "--" && item.phoneB.replace(/[, ]/g, '') !== "")
                ) && // Verifica telefone A ou B
                item.col5 && item.col5 !== "--" && item.col5 !== "" && // Verifica insurance details
                item.col7 && item.col7 !== "--"; // Verifica idade

            tableBody.innerHTML += 
            `<tr class="main-row ${isHotLead ? 'hot-lead' : ''}" data-id="${item.id}">
                <td><input type="checkbox" class="rowCheckbox" data-id="${item.id}" data-item='${itemString}'></td>
                <td class="expand-icon" onclick="toggleDetails('${item.id}')">▶</td>
                <td>${item.id}</td>
                <td>${item.col2}</td>
                <td>${item.col3}</td>
                <td>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <div style="display: flex; flex-direction: column; gap: 4px;">
                        <input 
                            type="text" 
                            value="${item.phoneA}" 
                            data-passenger-id="${item.passengerId}" 
                            class="phoneInput phoneInputA" 
                            style="width: 110px; padding: 4px;"
                        />
                        <input 
                            type="text" 
                            value="${item.phoneB}" 
                            data-passenger-id="${item.passengerId}" 
                            class="phoneInput phoneInputB" 
                            style="width: 110px; padding: 4px;"
                        />
                        </div>
                        <button id="saveButton" onclick="savePhoneNumber(this)" style="cursor: pointer; border: none; background: none;">
                        💾
                        </button>
                    </div>
                    </td>
                <td>${item.col5}</td>
                <td>${item.col6}</td>
                <td>${item.col7}</td>
                <td>${item.col8}</td>
                <td>${item.col9}</td>
                <td>${item.col10}</td>
                <td>${item.col11}</td>
                <td>${linkIcon}</td>    
                <td>${item.col13}</td>
            </tr>
            <tr class="details-row" id="details-${item.id}" style="display: none;">
                <td colspan="15">
                    <div class="details-content" id="details-content-${item.id}">
                        <!-- Conteúdo será carregado dinamicamente -->
                    </div>
                </td>
            </tr>`;
        });
        renderPagination(totalPages);

        // Sincroniza checkboxes com seleção global
        document.querySelectorAll(".rowCheckbox").forEach(checkbox => {
            const itemString = checkbox.getAttribute("data-item");

            checkbox.checked = selectedItems.has(itemString);

            checkbox.onchange = () => {
                if (checkbox.checked) {
                    selectedItems.add(itemString);
                } else {
                    selectedItems.delete(itemString);
                }
                updateSelectAllCheckbox();
            };
        });

        updateSelectAllCheckbox();
    }

    async function savePhoneNumber(button) {
        const row = button.closest("tr");
        const inputA = row.querySelector(".phoneInputA");
        const inputB = row.querySelector(".phoneInputB");

    function escapeHtml(unsafe) {
        return unsafe

            .replace(/</g, "&lt;")

            .replace(/'/g, "&#039;");
    }

    let pageGroupStart = 1;

    function renderPagination(totalPages) {
        const container = document.getElementById("pagination");
        container.innerHTML = "";

        const groupSize = 10;
        const groupEnd = Math.min(pageGroupStart + groupSize - 1, totalPages);

        // Botões "Ver X" ANTES do grupo atual
        for (let i = 1; i < pageGroupStart; i += groupSize) {
            const jumpBackBtn = document.createElement("button");
            jumpBackBtn.textContent = `◀ (${i})`;
            jumpBackBtn.classList.add("special");
            jumpBackBtn.onclick = () => {
                pageGroupStart = i;
                currentPage = i;
                renderTable();
            };
            container.appendChild(jumpBackBtn);
        }

        // Botões do grupo atual
        for (let i = pageGroupStart; i <= groupEnd; i++) {
            const btn = document.createElement("button");
            btn.textContent = i;
            btn.style.fontWeight = i === currentPage ? "bold" : "normal";
            btn.onclick = () => {
                currentPage = i;
                renderTable();
            };
            container.appendChild(btn);
        }

        // Botões "Ver X" DEPOIS do grupo atual
        for (let i = groupEnd + 1; i <= totalPages; i += groupSize) {
            const jumpNextBtn = document.createElement("button");
            jumpNextBtn.textContent = `(${i}) ▶`;
            jumpNextBtn.classList.add("special");
            jumpNextBtn.onclick = () => {
                pageGroupStart = i;
                currentPage = i;
                renderTable();
            };
            container.appendChild(jumpNextBtn);
        }
    }

    // Função para carregar todos os filtros de forma interdependente
    function loadFilters() {
        const filterSourceFolder = document.getElementById("filterSourceFolder");
        const filterCol10 = document.getElementById("filterCol10");
        const filterCol11 = document.getElementById("filterCol11");
        
        // Obter valores atuais dos filtros
        const agencySelected = filterSourceFolder.value;
        const stateSelected = filterCol10.value;
        const citySelected = filterCol11.value;
        
        // Determinar quais combinações são válidas com base nas seleções atuais
        let filteredData = data;
        
        // Se cidade está selecionada, filtrar primeiro por ela
        if (citySelected && citySelected !== "") {
            filteredData = filteredData.filter(item => item.col11 === citySelected);
        }
        
        // Se estado está selecionado, filtrar por ele
        if (stateSelected && stateSelected !== "") {
            filteredData = filteredData.filter(item => item.col10 === stateSelected);
        }
        
        // Se agency está selecionada, filtrar por ela
        if (agencySelected && agencySelected !== "") {
            filteredData = filteredData.filter(item => item.sourceFolder === agencySelected);
        }
        
        // 1. Atualizar filtro de Agencies com base nas seleções atuais
        const agencies = [...new Set(filteredData.map(i => i.sourceFolder))].sort();
        updateFilterOptions(filterSourceFolder, agencies, "-- All Agencies --", agencySelected);
        
        // 2. Atualizar filtro de States com base nas seleções atuais
        const states = [...new Set(filteredData.map(i => i.col10).filter(s => s && s !== "--"))].sort();
        updateFilterOptions(filterCol10, states, "-- All States --", stateSelected);
        
        // 3. Atualizar filtro de Cities com base nas seleções atuais
        const cities = [...new Set(filteredData.map(i => i.col11).filter(c => c && c !== "--"))].sort();
        updateFilterOptions(filterCol11, cities, "-- All Cities --", citySelected);
    }

    // Função auxiliar para atualizar opções de um filtro
    function updateFilterOptions(selectElement, options, defaultText, selectedValue) {
        const currentValue = selectElement.value;
        selectElement.innerHTML = `<option value="">${defaultText}</option>`;
        
        options.forEach(option => {
            const optElement = new Option(option, option);
            if (option === selectedValue || (!selectedValue && option === currentValue)) {
                optElement.selected = true;
            }
            selectElement.appendChild(optElement);
        });
    }

    let estadoCidadeMap = {};
    function updateRelationStateCity(dados) {
        estadoCidadeMap = {};

        dados.forEach(incidente => {
            const estado = incidente.state?.trim();
            const cidade = incidente.city?.trim();

            if (estado && cidade) {
                if (!estadoCidadeMap[estado]) estadoCidadeMap[estado] = new Set();
                estadoCidadeMap[estado].add(cidade);
            }
        });
    }

    function updateFilterPerState(estadoSelecionado) {
        const cidadesFiltradas = estadoCidadeMap[estadoSelecionado] || new Set();
        const filterCol11 = document.getElementById("filterCol11");

        filterCol11.innerHTML = '<option value="">-- All Cities --</option>';
        [...cidadesFiltradas].sort().forEach(cidade => {
            const option = new Option(cidade, cidade);
            filterCol11.appendChild(option);
        });
    }

    function updateFilterPerCity(cidadeSelecionada) {
        const estadosFiltrados = Object.entries(estadoCidadeMap)
            .filter(([_, cidades]) => cidades.has(cidadeSelecionada))
            .map(([estado]) => estado);

        const filterCol10 = document.getElementById("filterCol10");
        filterCol10.innerHTML = '<option value="">-- All States --</option>';
        estadosFiltrados.sort().forEach(estado => {
            const option = new Option(estado, estado);
            filterCol10.appendChild(option);
        });
    }

    function updateFilters(filteredData) {
        const estados = new Set();
        const cidades = new Set();

        filteredData.forEach(incidente => {
            if (incidente.state) estados.add(incidente.state.trim());
            if (incidente.city) cidades.add(incidente.city.trim());
        });

        const filterCol10 = document.getElementById("filterCol10");
        const filterCol11 = document.getElementById("filterCol11");

        filterCol10.innerHTML = '<option value="">-- All States --</option>';
        filterCol11.innerHTML = '<option value="">-- All Cities --</option>';

        [...estados].sort().forEach(estado => {
            const option = new Option(estado, estado);
            filterCol10.appendChild(option);
        });

        [...cidades].sort().forEach(cidade => {
            const option = new Option(cidade, cidade);
            filterCol11.appendChild(option);
        });
    }

    function downloadCSV() {
        if (selectedItems.size === 0) {
            alert("Select at least one report to download a file.");
            return;
        }

        const selectedData = Array.from(selectedItems).map(i => JSON.parse(i));  // <- CORREÇÃO

        const headers = [
            "Report Number", "Date", "Driver Name", "Phone A", "Phone B", "Insurance Details", 
            "Age", "Gender", "Owner Address", "State", "City",
        ];
        //  "Report URL" , "Additional Info"

        const csvRows = selectedData.map(item => [
            item.id, item.col2, item.col3, item.phoneA, item.phoneB || "--", item.col5, 
            item.col7, item.col8, item.col9, item.col10, item.col11
        ].map(value => `"${value}"`).join(','));

        // item.col6,, item.col12

        const csvContent = [headers.join(','), ...csvRows].join('\n');

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'selected_reports.csv';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function toggleDetails(reportId) {
        const detailsRow = document.getElementById(`details-${reportId}`);
        const expandIcon = document.querySelector(`tr.main-row[data-id="${reportId}"] .expand-icon`);
        
        if (detailsRow.style.display === 'none') {
            // Se estiver recolhido, expande e carrega os detalhes
            detailsRow.style.display = 'table-row';
            expandIcon.textContent = '▼';
            
            // Carrega os detalhes apenas se ainda não foram carregados
            if (!detailsRow.dataset.loaded) {
                loadReportDetails(reportId);
                detailsRow.dataset.loaded = 'true';
            }
        } else {
            // Se estiver expandido, recolhe
            detailsRow.style.display = 'none';
            expandIcon.textContent = '▶';
        }
    }

    async function loadReportDetails(reportId) {
        
        const detailsContent = document.getElementById(`details-content-${reportId}`);
        detailsContent.innerHTML = '<p>Loading details...</p>';
        
        try {
            // Encontra o item completo nos dados filtrados
            const incident = filteredData.find(item => item.id === reportId);
            
            if (!incident) {
                detailsContent.innerHTML = '<p>Error: Report not found</p>';
                return;
            }
            
            const originalData = incident.original;
            
            // Renderiza os detalhes baseado na cidade/estado
            detailsContent.innerHTML = renderGenericDetails(originalData);
            
        } catch (error) {
            console.error('Error loading report details:', error);
            detailsContent.innerHTML = '<p>Error loading details</p>';
        }
    }

    function renderGenericDetails(incident) {
        const city = incident.city || '';
        const state = incident.state || '';
        const dateTime = incident.accident_datetime ? new Date(incident.accident_datetime).toLocaleString() : 'N/A';
        const numberOfVehicles = Array.isArray(incident.vehicles) ? incident.vehicles.length : 0;

        let html = `
            <div class="incident-details">
                <h3>Accident Details - ${incident.report_number || '--'}</h3>
                <div class="general-info">
                    <p><strong>Date & Time:</strong> ${dateTime}</p>
                    <p><strong>Location:</strong> ${incident.street || '--'}, ${city}, ${state}</p>
                    ${incident.weather_condition ? `<p><strong>Weather:</strong> ${incident.weather_condition}</p>` : ''}
                    ${incident.road_condition ? `<p><strong>Road Condition:</strong> ${incident.road_condition}</p>` : ''}
                    ${incident.crash_severity ? `<p><strong>Severity:</strong> ${incident.crash_severity}</p>` : ''}
                    ${incident.narrative ? `<p><strong>Narrative:</strong> ${incident.narrative}</p>` : ''}
                    ${incident.notes ? `<p><strong>Notes:</strong> ${incident.notes}</p>` : ''}
                </div>
        `;
        // <p><strong>Units Involved:</strong> ${numberOfVehicles}</p>
        // Mostrar veículos se existirem
        if (numberOfVehicles > 0) {
            html += `
                <div class="vehicles-section">
                    <h4>Vehicles Involved (${numberOfVehicles})</h4>
                    <ul>
            `;

            incident.vehicles.forEach((vehicle, idx) => {
                const nameParts = [
                    vehicle.driver_first_name,
                    vehicle.driver_middle_name,
                    vehicle.driver_last_name
                ].filter(part => part && part.trim() !== "");

                const driverName = nameParts.length > 0 
                    ? nameParts.join(" ") 
                    : (vehicle.driver_name || "--");

                html += `
                    <li>
                        <strong>Unit ${idx + 1} driver:</strong> ${driverName}<br>
                    </li>
                `;
            });

            html += `</ul></div>`;
        }

            html += `</div>`; // Fecha a div incident-details

            return html;
        }
