    function transformarDados(dados) {
        let incidentesFormatados = [];

        dados.forEach(incidente => {
            const folder = incidente.original_document_location?.split("/")[3] || "--";

            incidente.vehicles.forEach(veiculo => {
                const motorista = veiculo.passengers?.find(p => p.role === "Driver") || {};
                const driverName = motorista.name || veiculo.driver_name || "--";
                const insuranceDetails = veiculo.insurance_company ? `Insurance Company: ${veiculo.insurance_company}` : "N/A";
                const driverLicense = veiculo.driver_license ? ` <br> License: ${veiculo.driver_license}` : "";
                const policyNumber = veiculo.policy_number ? ` <br> Policy: ${veiculo.policy_number}` : "";

                if (["Unknown", "--", "UNKNOWN"].includes(driverName) || insuranceDetails === "N/A") return;

                incidentesFormatados.push({
                    id: incidente.report_number,
                    col2: incidente.accident_datetime.split("T")[0],
                    col3: driverName,
                    col4: motorista.phone1 || "--",
                    col5: (insuranceDetails + driverLicense + policyNumber) || "--",
                    col6: incidente.crash_severity || "--",
                    col7: motorista.age || "--",
                    col8: motorista.gender || "--",
                    col9: veiculo.owner_address || "--",
                    col10: incidente.state || "--",
                    col11: incidente.city || "--",
                    col12: `https://990c-52-116-202-144.ngrok-free.app/incident/pdf/view/${incidente.pdf_id || incidente.report_number}`,
                    col13: "--",
                    sourceFolder: folder
                });
            });
        });

        return incidentesFormatados.sort((a, b) => new Date(b.col2) - new Date(a.col2));
    }

    // Modificar a função de renderTable para usar os filtros corretamente
    function renderTable() {
        const tableBody = document.getElementById("tableBody");
        const filterFolder = document.getElementById("filterSourceFolder").value;
        const filterDate = document.getElementById("filterDate").value;
        const filterCol10 = document.getElementById("filterCol10").value;
        const filterCol11 = document.getElementById("filterCol11").value;

        const filteredData = data.filter(item =>
            (!filterFolder || item.sourceFolder === filterFolder) &&
            (!filterDate || item.col2 === filterDate) &&
            (item.col5 === "--" || (parseInt(item.col7) >= 18)) &&
            (!filterCol10 || item.col10 === filterCol10) &&
            (!filterCol11 || item.col11 === filterCol11)
        );

        const totalPages = Math.ceil(filteredData.length / rowsPerPage);
        currentPage = Math.min(currentPage, totalPages || 1);
        const start = (currentPage - 1) * rowsPerPage;
        const end = start + rowsPerPage;

        tableBody.innerHTML = "";

        filteredData.slice(start, end).forEach((item, index) => {
            const realIndex = start + index;
            const linkIcon = item.col12 ? `<a href="#" onclick="viewPDF('${item.col12}', '${item.id}')">🔗</a>` : "";

            tableBody.innerHTML += `<tr>
                <td><input type="checkbox" class="rowCheckbox" data-id="${item.id}" data-item='${escapeHtml(JSON.stringify(item))}'></td>
                <td>${item.id}</td>
                <td>${item.col2}</td>
                <td>${item.col3}</td>
                <td>${item.col4}</td>
                <td>${item.col5}</td>
                <td>${item.col6}</td>
                <td>${item.col7}</td>
                <td>${item.col8}</td>
                <td>${item.col9}</td>
                <td>${item.col10}</td>
                <td>${item.col11}</td>
                <td>${linkIcon}</td>    
                <td>${item.col13}</td>
            </tr>`;
        });


        renderPagination(totalPages);

        // Atualiza os checkboxes da página com base nos selecionados globalmente
        document.querySelectorAll(".rowCheckbox").forEach(checkbox => {
            const itemString = checkbox.getAttribute("data-item");
            
            // Marca como selecionado se já estiver salvo
            checkbox.checked = selectedItems.has(itemString);

            // Evita múltiplos event listeners no mesmo checkbox
            checkbox.onchange = () => {
                if (checkbox.checked) {
                    selectedItems.add(itemString);
                } else {
                    selectedItems.delete(itemString);
                }
                updateSelectAllCheckbox();
            };
        });

        updateSelectAllCheckbox(); // Reflete o estado correto do checkbox "select-all"

    }

    function escapeHtml(unsafe) {
        return unsafe
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function updateSelectAllCheckbox() {
        const checkboxes = document.querySelectorAll(".rowCheckbox");
        const allChecked = [...checkboxes].every(cb => cb.checked);
        const someChecked = [...checkboxes].some(cb => cb.checked);

        const selectAll = document.getElementById("selectAll");
        selectAll.checked = allChecked;
        selectAll.indeterminate = !allChecked && someChecked;
    }

    let pageGroupStart = 1;

    function renderPagination(totalPages) {
        const container = document.getElementById("pagination");
        container.innerHTML = "";

        const groupSize = 10;
        const groupEnd = Math.min(pageGroupStart + groupSize - 1, totalPages);

        // Botões "Ver X" ANTES do grupo atual
        for (let i = 1; i < pageGroupStart; i += groupSize) {
            const jumpBackBtn = document.createElement("button");
            jumpBackBtn.textContent = `${i}`;
            jumpBackBtn.classList.add("special");
            jumpBackBtn.onclick = () => {
                pageGroupStart = i;
                currentPage = i;
                renderTable();
            };
            container.appendChild(jumpBackBtn);
        }

        // Botões do grupo atual
        for (let i = pageGroupStart; i <= groupEnd; i++) {
            const btn = document.createElement("button");
            btn.textContent = i;
            btn.style.fontWeight = i === currentPage ? "bold" : "normal";
            btn.onclick = () => {
                currentPage = i;
                renderTable();
            };
            container.appendChild(btn);
        }

        // Botões "Ver X" DEPOIS do grupo atual
        for (let i = groupEnd + 1; i <= totalPages; i += groupSize) {
            const jumpNextBtn = document.createElement("button");
            jumpNextBtn.textContent = `${i}`;
            jumpNextBtn.classList.add("special");
            jumpNextBtn.onclick = () => {
                pageGroupStart = i;
                currentPage = i;
                renderTable();
            };
            container.appendChild(jumpNextBtn);
        }
    }


    // Função para carregar todos os filtros de forma interdependente
    function carregarFiltros() {
        const filterSourceFolder = document.getElementById("filterSourceFolder");
        const filterCol10 = document.getElementById("filterCol10");
        const filterCol11 = document.getElementById("filterCol11");
        
        // Obter valores atuais dos filtros
        const agencySelected = filterSourceFolder.value;
        const stateSelected = filterCol10.value;
        const citySelected = filterCol11.value;
        
        // Determinar quais combinações são válidas com base nas seleções atuais
        let filteredData = data;
        
        // Se cidade está selecionada, filtrar primeiro por ela
        if (citySelected && citySelected !== "") {
            filteredData = filteredData.filter(item => item.col11 === citySelected);
        }
        
        // Se estado está selecionado, filtrar por ele
        if (stateSelected && stateSelected !== "") {
            filteredData = filteredData.filter(item => item.col10 === stateSelected);
        }
        
        // Se agency está selecionada, filtrar por ela
        if (agencySelected && agencySelected !== "") {
            filteredData = filteredData.filter(item => item.sourceFolder === agencySelected);
        }
        
        // 1. Atualizar filtro de Agencies com base nas seleções atuais
        const agencies = [...new Set(filteredData.map(i => i.sourceFolder))].sort();
        updateFilterOptions(filterSourceFolder, agencies, "-- All Agencies --", agencySelected);
        
        // 2. Atualizar filtro de States com base nas seleções atuais
        const states = [...new Set(filteredData.map(i => i.col10).filter(s => s && s !== "--"))].sort();
        updateFilterOptions(filterCol10, states, "-- All States --", stateSelected);
        
        // 3. Atualizar filtro de Cities com base nas seleções atuais
        const cities = [...new Set(filteredData.map(i => i.col11).filter(c => c && c !== "--"))].sort();
        updateFilterOptions(filterCol11, cities, "-- All Cities --", citySelected);
    }

    // Função auxiliar para atualizar opções de um filtro
    function updateFilterOptions(selectElement, options, defaultText, selectedValue) {
        const currentValue = selectElement.value;
        selectElement.innerHTML = `<option value="">${defaultText}</option>`;
        
        options.forEach(option => {
            const optElement = new Option(option, option);
            if (option === selectedValue || (!selectedValue && option === currentValue)) {
                optElement.selected = true;
            }
            selectElement.appendChild(optElement);
        });
    }


    let estadoCidadeMap = {};
    function atualizarRelacionamentosEstadoCidade(dados) {
        estadoCidadeMap = {};

        dados.forEach(incidente => {
            const estado = incidente.state?.trim();
            const cidade = incidente.city?.trim();

            if (estado && cidade) {
                if (!estadoCidadeMap[estado]) estadoCidadeMap[estado] = new Set();
                estadoCidadeMap[estado].add(cidade);
            }
        });
    }

    function atualizarFiltrosPorEstado(estadoSelecionado) {
        const cidadesFiltradas = estadoCidadeMap[estadoSelecionado] || new Set();
        const filterCol11 = document.getElementById("filterCol11");

        filterCol11.innerHTML = '<option value="">-- All Cities --</option>';
        [...cidadesFiltradas].sort().forEach(cidade => {
            const option = new Option(cidade, cidade);
            filterCol11.appendChild(option);
        });
    }

    function atualizarFiltrosPorCidade(cidadeSelecionada) {
        const estadosFiltrados = Object.entries(estadoCidadeMap)
            .filter(([_, cidades]) => cidades.has(cidadeSelecionada))
            .map(([estado]) => estado);

        const filterCol10 = document.getElementById("filterCol10");
        filterCol10.innerHTML = '<option value="">-- All States --</option>';
        estadosFiltrados.sort().forEach(estado => {
            const option = new Option(estado, estado);
            filterCol10.appendChild(option);
        });
    }

    function atualizarFiltros(dadosFiltrados) {
        const estados = new Set();
        const cidades = new Set();

        dadosFiltrados.forEach(incidente => {
            if (incidente.state) estados.add(incidente.state.trim());
            if (incidente.city) cidades.add(incidente.city.trim());
        });

        const filterCol10 = document.getElementById("filterCol10");
        const filterCol11 = document.getElementById("filterCol11");

        filterCol10.innerHTML = '<option value="">-- All States --</option>';
        filterCol11.innerHTML = '<option value="">-- All Cities --</option>';

        [...estados].sort().forEach(estado => {
            const option = new Option(estado, estado);
            filterCol10.appendChild(option);
        });

        [...cidades].sort().forEach(cidade => {
            const option = new Option(cidade, cidade);
            filterCol11.appendChild(option);
        });
    }

    function downloadCSV() {
        if (selectedItems.size === 0) {
            alert("Select at least one report to download a file.");
            return;
        }

        const selectedData = Array.from(selectedItems).map(i => JSON.parse(i));  // <- CORREÇÃO

        const headers = [
            "Report Number", "Date", "Driver Name", "Phone", "Insurance Details", 
            "Age", "Gender", "Owner Address", "State", "City", "Report URL", "Additional Info"
        ];

        const csvRows = selectedData.map(item => [
            item.id, item.col2, item.col3, item.col4, item.col5, item.col6,
            item.col7, item.col8, item.col9, item.col10, item.col11, item.col12
        ].map(value => `"${value}"`).join(','));

        const csvContent = [headers.join(','), ...csvRows].join('\n');

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'selected_reports.csv';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // Função para selecionar/deselecionar todos os checkboxes
    function toggleSelectAll(masterCheckbox) {
        const isChecked = masterCheckbox.checked;
        const checkboxes = document.querySelectorAll(".rowCheckbox");

        checkboxes.forEach(cb => {
            const itemString = cb.getAttribute("data-item");  // Aqui, garantimos que estamos utilizando o item completo (não só o id)
            cb.checked = isChecked;
            if (isChecked) {
                selectedItems.add(itemString);  // Adiciona o item inteiro na seleção global
            } else {
                selectedItems.delete(itemString);  // Remove o item da seleção global
            }
        });

        updateSelectAllCheckbox();  // Atualiza o estado do checkbox "select-all"
    }

    // Função para atualizar o estado do checkbox "select-all"
    function updateSelectAllCheckbox() {
        const checkboxes = document.querySelectorAll(".rowCheckbox");
        const allChecked = [...checkboxes].every(cb => cb.checked);
        const someChecked = [...checkboxes].some(cb => cb.checked);

        const selectAll = document.getElementById("selectAll");
        selectAll.checked = allChecked;
        selectAll.indeterminate = !allChecked && someChecked;
    }

    function viewPDF(url, id) {
        document.getElementById("pdfViewer").data = url;
        document.getElementById("pdfId").textContent = id;

        const freeSpace = document.getElementById("freeSpace");
        const tableContainer = document.querySelector(".table-container");

        freeSpace.style.display = "block";
        freeSpace.style.width = "30%";
        tableContainer.style.width = "70%";
        freeSpace.style.opacity = "1";
        freeSpace.style.transition = "width 0.3s ease, opacity 0.3s ease";
        tableContainer.style.transition = "width 0.3s ease";
    }

    function hidePDF() {
        const freeSpace = document.getElementById("freeSpace");
        const tableContainer = document.querySelector(".table-container");

        freeSpace.style.width = "0";
        freeSpace.style.opacity = "0";
        freeSpace.style.transition = "width 0.3s ease, opacity 0.3s ease";
        tableContainer.style.transition = "width 0.3s ease";

        setTimeout(() => {
            freeSpace.style.display = "none";
            tableContainer.style.width = "100%";
        }, 300);
    }
