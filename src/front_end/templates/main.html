<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hope Neuro Crash Reports</title>
    
    <style>
        /* --- :::::::::::::::: Reset básico e fontes :::::::::::::::: --- */
        :root {
            --primary-color: #57e0e02f;
            --secondary-color: #6c757d;
            --light-color: #f8f9fa;
            --dark-color: #343a40;
            --border-color: #dee2e6;
            --hover-color: #e9ecef;
            --header-bg: #ffffff;
            --shadow-color: rgba(0, 0, 0, 0.1);
        }
    
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--primary-color);
            color: var(--dark-color);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
    
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        body, html {
            overflow: hidden;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    
        /* --- :::::::::::::::::::::::::::::::: CABEÇALHO :::::::::::::::::::::::::::::::: --- */
        .site-header {
            background-color: var(--header-bg);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 4px var(--shadow-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
    
        .site-header .logo-container img {
            max-height: 35px;
            margin: 0 10px;
        }
    
        /* --- :::::::::::::::::::::::::::::::: CONTEUDO PRINCIPAL :::::::::::::::::::::::::::::::: --- */
        .main-content {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
        }
    
        .main-content h2 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
        }
    
        /* --- :::::::::::::::::::::::::::::::: LOADING MESSAGE :::::::::::::::::::::::::::::::: --- */
        #loading {
            text-align: center;
            font-size: 1.5em;
            color: var(--secondary-color);
            margin: 50px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #loading h3 {
            font-size: 28px;
        }
    
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: blue;
            animation: spin 1s ease infinite;
            margin-bottom: 15px;
        }
    
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    
        /* --- :::::::::::::::::::::::::::::::: FILTROS :::::::::::::::::::::::::::::::: --- */
        #filters {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            font-family: Arial, sans-serif;
            margin-bottom: 20px;
        }

        #filters label {
            display: flex;
            flex-direction: column;
            font-size: 14px;
            color: #333;
        }

        #filters input[type="date"],
        #filters select {
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            min-width: 160px;
            margin-top: 5px;
        }

        #filters button {
            padding: 8px 16px;
            background-color: #34d0db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s ease;
            margin-top: 20px;
        }

        #filters button:hover {
            background-color: #0056b3;
        }

        #filters button:last-of-type {
            background-color: #6c757d;
        }

        #filters button:last-of-type:hover {
            background-color: #5a6268;
        }


        /* --- :::::::::::::::::::::::::::::::: TABELA :::::::::::::::::::::::::::::::: --- */
        .table-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            width: 100%;
            max-width: 100%;
            max-height: 97%;
            overflow: hidden;
            padding-top:5px;
        }

        /* Container da tabela com scroll VERTICAL apenas */
        .table-scroll-container {
            overflow-x: hidden; /* Remove scroll horizontal */
            overflow-y: auto;   /* Mantém scroll vertical */
            flex: 1;
            max-height: calc(100vh - 350px); /* Ajuste conforme necessário */
            width: 100%;
            border: #6c757d;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }

        /* Estilo para a tabela - agora sem largura mínima fixa */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border-radius: 10px;
            overflow: hidden;
            text-transform: uppercase;
            margin-bottom: 10px;
            /* Removido o min-width para permitir que a tabela se ajuste */
        }

        /* Garante que o conteúdo das células quebre linha quando necessário */
        th, td {
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            text-align: left;
            vertical-align: middle;
            white-space: normal; /* Permite quebra de linha */
            word-wrap: break-word; /* Quebra palavras longas */
            max-width: 200px; /* Limite máximo para cada célula */
        }

        /* Mantém o cabeçalho fixo durante o scroll */
        thead th {
            background-color: var(--hover-color);
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }
    
        /* Controles de paginação */
        .pagination-controls {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
        }

        .pagination-controls button {
            background-color: var(--primary-color);
            color: rgb(0, 0, 0);
            border: none;
            padding: 10px 15px;
            margin: 0 5px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 1em;
        }
        
        .pagination-controls button:hover {
            background-color: var(--hover-color);
        }

        /* Estilo para a linha de detalhes */
        .incident-details {
            text-align: left;
            font-size: 14px;
            padding: 10px;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: var(--light-color);
        }

        .incident-details h3 {
            font-size: 15px;
            margin: 0 0 10px;
            font-weight: bold;
            color: #333;
        }

        .general-info p,
        .vehicles-section li {
            margin: 4px 0;
            color: #444;
        }

        .vehicles-section {
            margin-top: 10px;
        }

        .vehicles-section h4 {
            margin-bottom: 5px;
            font-size: 15px;
            font-weight: bold;
            color: #222;
        }

        .vehicles-section ul {
            list-style-type: disc;
            padding-left: 20px;
        }

        .vehicles-section li {
            padding-left: 5px;
        }

        /* Garante que os detalhes tenham espaço e fiquem bem visíveis */
        .details-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            background-color: #f9f9f9;
        }

        button {
            background-color: var(--hover-color);
            color: rgb(0, 0, 0);
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
        }

    
        /* --- :::::::::::::::::::::::::::::::: RESPONSIVIDADE :::::::::::::::::::::::::::::::: --- */
        @media (max-width: 992px) {
            .table-scroll-container {
                max-height: calc(100vh - 200px);
            }
            
            th, td {
                padding: 10px 8px;
                font-size: 0.9em;
            }
        }
    
        @media (max-width: 768px) {
            .site-header {
                flex-direction: column;
                padding: 15px;
            }
    
            .site-header .logo-container {
                display: flex;
                justify-content: space-around;
                width: 100%;
                margin-bottom: 10px;
            }
            
            .site-header .logo-container img {
                max-height: 40px;
            }
    
            .main-content h2 {
                font-size: 1.5em;
            }
    
            .table-scroll-container {
                max-height: calc(100vh - 180px);
            }
        }
    
        @media (max-width: 480px) {
            .site-header .logo-container img {
                max-height: 35px;
            }
            
            .main-content h2 {
                font-size: 1.3em;
            }
            
            .table-scroll-container {
                max-height: calc(100vh - 160px);
            }
            
            th, td {
                padding: 8px 6px;
                font-size: 0.8em;
            }
        }
    </style>

    <style>
        .clickable-report-number {
            background: none;
            border: none;
            color: blue; /* Ou a cor que preferir para links */
            text-decoration: underline;
            cursor: pointer;
            padding: 0;
            font-size: inherit; /* Herda o tamanho da fonte da célula */
        }

        .clickable-report-number:hover {
            color: darkblue; /* Cor ao passar o mouse */
        }
</style>
</head>
<body>

    <header class="site-header sticky">
        <div class="logo-container">
            <img src="./images/rel8ed_logo_v2.png" alt="Logo Empresa X">
        </div>
        <div class="logo-container">
            <img src="./images/Hope-Neuro_Logo.png" alt="Logo Parceiro Y">
        </div>
    </header>

    <main class="main-content">
        <div id="loading">
            <h3>Hope Neuro Crash Reports</h3>
            <br>
            <div class="spinner"></div>
            Loading Data...
        </div>

        <div class="table-container">
            <div id="filters" style="margin: 20px;">
                <label>
                    From:
                    <input type="date" id="filter-from">
                </label>
                <label>
                    To:
                    <input type="date" id="filter-to">
                </label>
                <label>
                    State:
                    <select id="filter-state"> <option value="">All States</option>
                    </select>
                </label>
                <button onclick="applyFilters()">Apply Filters</button>
                <button onclick="resetFilters()">Reset</button>
                <button onclick="downloadSelectedCSV()" id="download-csv-button" style="margin-left: 10px;">Selected Reports (0)</button>
            </div>
            <div class="table-scroll-container">
                <table id="data-table">
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="select-all-current-page" title="Selecionar todos nesta página"></th> <th>Details</th>
                            <th>Report N°</th>
                            <th>Crash Date</th>
                            <th>Driver Name</th>
                            <th>Phone N°</th>
                            <th>Insurance Details</th>
                            <th>Crash Severity</th>
                            <th>Age</th>
                            <th>Gender</th>
                            <th>Address</th>
                            <th>State</th>
                            <th>City</th>
                            <th>Report PDF</th>
                            <th>Distance from Clinic</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        </tbody>
                </table>
            </div>

            <div class="pagination-controls">
                <button onclick="previousPage()">«</button>
                <span id="page-number">Page 1</span>
                <button onclick="nextPage()">»</button>
            </div>
        </div>
    </main>

    <script>

        window.watsonAssistantChatOptions = {
            integrationID: "aa6251d5-7615-46fd-9a89-dcce1a75b536", // The ID of this integration.
            region: "us-south", // The region your integration is hosted in.
            serviceInstanceID: "1fe70761-3293-40e8-94d4-3dab7c3a289a", // The ID of your service instance.
            //   onLoad: async (instance) => { await instance.render(); 
            onLoad: async (instance) => {
                window.g_wa_instance = instance; // armazena globalmente
                await instance.render();
            }
        };
        setTimeout(function(){
            const t=document.createElement('script');
            t.src="https://web-chat.global.assistant.watson.appdomain.cloud/versions/" + (window.watsonAssistantChatOptions.clientVersion || 'latest') + "/WatsonAssistantChatEntry.js";
            document.head.appendChild(t);
        });

        // selectedItems agora armazena os objetos de dados das linhas selecionadas
        let selectedRowDataForExport = [];
        // selectedItemIds armazena os IDs únicos para gerenciar o estado dos checkboxes
        const selectedItemIds = new Set();

        let currentApiData = []; // Armazena os dados brutos da API para a página atual
        let currentlyDisplayedData = []; // Armazena os objetos de dados processados para a página atual

        const states = [
            { name: 'Alabama', abbr: 'AL' }, { name: 'Alaska', abbr: 'AK' },
            { name: 'Arizona', abbr: 'AZ' }, { name: 'Arkansas', abbr: 'AR' },
            { name: 'California', abbr: 'CA' }, { name: 'Colorado', abbr: 'CO' },
            { name: 'Connecticut', abbr: 'CT' }, { name: 'Delaware', abbr: 'DE' },
            { name: 'Florida', abbr: 'FL' }, { name: 'Georgia', abbr: 'GA' },
            { name: 'Hawaii', abbr: 'HI' }, { name: 'Idaho', abbr: 'ID' },
            { name: 'Illinois', abbr: 'IL' }, { name: 'Indiana', abbr: 'IN' },
            { name: 'Iowa', abbr: 'IA' }, { name: 'Kansas', abbr: 'KS' },
            { name: 'Kentucky', abbr: 'KY' }, { name: 'Louisiana', abbr: 'LA' },
            { name: 'Maine', abbr: 'ME' }, { name: 'Maryland', abbr: 'MD' },
            { name: 'Massachusetts', abbr: 'MA' }, { name: 'Michigan', abbr: 'MI' },
            { name: 'Minnesota', abbr: 'MN' }, { name: 'Mississippi', abbr: 'MS' },
            { name: 'Missouri', abbr: 'MO' }, { name: 'Montana', abbr: 'MT' },
            { name: 'Nebraska', abbr: 'NE' }, { name: 'Nevada', abbr: 'NV' },
            { name: 'New Hampshire', abbr: 'NH' }, { name: 'New Jersey', abbr: 'NJ' },
            { name: 'New Mexico', abbr: 'NM' }, { name: 'New York', abbr: 'NY' },
            { name: 'North Carolina', abbr: 'NC' }, { name: 'North Dakota', abbr: 'ND' },
            { name: 'Ohio', abbr: 'OH' }, { name: 'Oklahoma', abbr: 'OK' },
            { name: 'Oregon', abbr: 'OR' }, { name: 'Pennsylvania', abbr: 'PA' },
            { name: 'Rhode Island', abbr: 'RI' }, { name: 'South Carolina', abbr: 'SC' },
            { name: 'South Dakota', abbr: 'SD' }, { name: 'Tennessee', abbr: 'TN' },
            { name: 'Texas', abbr: 'TX' }, { name: 'Utah', abbr: 'UT' },
            { name: 'Vermont', abbr: 'VT' }, { name: 'Virginia', abbr: 'VA' },
            { name: 'Washington', abbr: 'WA' }, { name: 'West Virginia', abbr: 'WV' },
            { name: 'Wisconsin', abbr: 'WI' }, { name: 'Wyoming', abbr: 'WY' }
        ];

        let currentPage = 1;
        const pageSize = 10;
        let currentFilters = { from: '', to: '', state: '' };

        function applyFilters() {
            currentFilters.from = document.getElementById('filter-from').value;
            currentFilters.to = document.getElementById('filter-to').value;
            currentFilters.state = document.getElementById('filter-state').value;
            currentPage = 1;
            // Considere limpar seleções ao aplicar filtros ou mantê-las
            // selectedItemIds.clear();
            // selectedRowDataForExport = [];
            // updateDownloadButton();
            fetchData();
        }

        function resetFilters() {
            document.getElementById('filter-from').value = '';
            document.getElementById('filter-to').value = '';
            document.getElementById('filter-state').value = '';
            currentFilters = { from: '', to: '', state: '' };
            currentPage = 1;
            // selectedItemIds.clear();
            // selectedRowDataForExport = [];
            // updateDownloadButton();
            fetchData();
        }

        async function fetchData(retryWithName = false) {
            const { from, to, state } = currentFilters;
            const loadingDiv = document.getElementById("loading");
            const tableContainer = document.querySelector(".table-container");
            const tableBody = document.getElementById("table-body");

            document.getElementById("page-number").textContent = `Page ${currentPage}`;
            tableContainer.style.display = "none";
            loadingDiv.style.display = "flex";
            document.getElementById('select-all-current-page').checked = false; // Desmarca o checkbox do cabeçalho

            let stateQuery = "";
            if (state) {
                const stateObj = states.find(s => s.abbr === state || s.name === state);
                stateQuery = retryWithName ? (stateObj?.name || state) : (stateObj?.abbr || state);
            }

            let url = `https://8162-52-116-202-144.ngrok-free.app/incident/search?page=${currentPage}&page_size=${pageSize}`;
            if (from) url += `&accident_from=${from}`;
            if (to) url += `&accident_to=${to}`;
            if (stateQuery) url += `&state=${encodeURIComponent(stateQuery)}`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                currentApiData = await response.json(); // Armazena dados brutos

                if (currentApiData.length === 0 && state && !retryWithName) {
                    return fetchData(true);
                }

                tableBody.innerHTML = '';
                currentlyDisplayedData = []; // Limpa os dados da exibição anterior

                currentApiData.forEach((incidente, incidentIndex) => {
                    const caminho = incidente.original_document_location?.replace(/\\/g, "/");
                    const partes = caminho?.split("/");
                    const folder = partes?.[3] || "Texas";

                    incidente.vehicles.forEach((veiculo, vehicleIndex) => {
                        const passageiros = veiculo.passengers?.length ?
                            veiculo.passengers :
                            [{
                                id: null, name: veiculo.driver_name,
                                first_name: veiculo.driver_first_name,
                                middle_name: veiculo.driver_middle_name,
                                last_name: veiculo.driver_last_name,
                                phone2: null, age: "--", gender: "--"
                            }];

                        passageiros.forEach((motorista, passengerIndex) => {
                            const nameParts = [motorista.first_name, motorista.middle_name, motorista.last_name]
                                .filter(part => part && part.trim() !== "");
                            const driverName = nameParts.length > 0 ? nameParts.join(" ") : (motorista.name || "--");

                            const insuranceDetailsText = veiculo.insurance_company ? `Insurance Company: ${veiculo.insurance_company}` : "--";
                            const driverLicenseText = veiculo.driver_license ? `License: ${veiculo.driver_license}` : "";
                            const policyNumberText = veiculo.policy_number ? `Policy: ${veiculo.policy_number}` : "";
                            const fullInsuranceDetailsHTML = `${insuranceDetailsText}${driverLicenseText ? '<br>' + driverLicenseText : ''}${policyNumberText ? '<br>' + policyNumberText : ''}`;

                            const crashSeverityText = incidente.crash_severity ? `Crash: ${incidente.crash_severity}` : "--";
                            const injurySeverityText = motorista.injury_severity ? `Type: ${motorista.injury_severity}` : "";
                            const fullCrashSeverityHTML = `${crashSeverityText}${injurySeverityText ? '<br>' + injurySeverityText : ''}`;

                            const nearestHopeMilesText = incidente.nearest_hope_d ? ` Miles: ${incidente.nearest_hope_d}` : "";
                            const nearestHopeCenterText = incidente.name_nearest_hope ? `Center: ${incidente.name_nearest_hope}` : "";
                            const fullDistanceToClinicHTML = `${nearestHopeMilesText}${nearestHopeCenterText ? '<br>' + nearestHopeCenterText : ''}`;

                            // ID único para cada linha que pode ser selecionada. MUITO IMPORTANTE!
                            // Se 'incidente.id' ou 'motorista.id' existir e for único, use-o.
                            // Caso contrário, crie um composto, garantindo sua unicidade.
                            const rowUniqueId = `incident_${incidente.report_number || incidentIndex}_vehicle_${vehicleIndex}_person_${passengerIndex}_${(driverName || 'unknown').replace(/\s+/g, '_')}`;

                            // Objeto de dados para exportação e gerenciamento
                            const rowDataItem = {
                                id: rowUniqueId,
                                reportNumber: incidente.report_number || '--',
                                crashDate: incidente.accident_datetime?.split("T")[0] || '--',
                                driverName: driverName,
                                phone: motorista.phone2 || "--",
                                insuranceDetails: [
                                    veiculo.insurance_company ? `Insurance Company: ${veiculo.insurance_company}`: '',
                                    veiculo.driver_license ? `License: ${veiculo.driver_license}` : '',
                                    veiculo.policy_number ? `Policy: ${veiculo.policy_number}` : ''
                                ].filter(Boolean).join('; ') || '--',
                                crashSeverity: [
                                    incidente.crash_severity ? `Crash: ${incidente.crash_severity}` : '',
                                    motorista.injury_severity ? `Type: ${motorista.injury_severity}` : ''
                                ].filter(Boolean).join('; ') || '--',
                                age: motorista.age || "--",
                                gender: motorista.gender || "--",
                                address: veiculo.owner_address || "--",
                                state: getFullStateName(incidente.state),
                                city: incidente.city || "--",
                                reportPDFUrl: folder?.toLowerCase() === "minnesota" ?
                                    incidente.source_url :
                                    `https://8162-52-116-202-144.ngrok-free.app/incident/pdf/view/${incidente.pdf_id || incidente.report_number}`,
                                distanceFromClinic: [
                                    incidente.nearest_hope_d ? `Miles: ${incidente.nearest_hope_d}`: '',
                                    incidente.name_nearest_hope ? `Center: ${incidente.name_nearest_hope}`: ''
                                ].filter(Boolean).join('; ') || '--',
                                // Guarde os objetos originais se precisar para a visualização de detalhes
                                originalIncident: incidente,
                                originalVehicle: veiculo,
                                originalMotorista: motorista
                            };
                            currentlyDisplayedData.push(rowDataItem);

                            const row = document.createElement("tr");
                            const isChecked = selectedItemIds.has(rowUniqueId);

                            row.innerHTML = `
                                <td><input type="checkbox" class="row-checkbox" data-row-id="${rowUniqueId}" ${isChecked ? 'checked' : ''}></td>
                                <td><button onclick="toggleDetails('${rowUniqueId}-details', this)">▶</button></td>
                                <td><button class="sendReportToChat clickable-report-number" data-id="${rowDataItem.reportNumber}">${rowDataItem.reportNumber}</button></td>
                                <td>${rowDataItem.crashDate}</td>
                                <td>${rowDataItem.driverName}</td>
                                <td>${rowDataItem.phone}</td>
                                <td>${fullInsuranceDetailsHTML}</td> <td>${fullCrashSeverityHTML}</td>   <td>${rowDataItem.age}</td>
                                <td>${rowDataItem.gender}</td>
                                <td>${rowDataItem.address}</td>
                                <td>${rowDataItem.state}</td>
                                <td>${rowDataItem.city}</td>
                                <td>${
                                    folder.toLowerCase() === "texas"
                                        ? '❌'
                                        : `<a href="${rowDataItem.reportPDFUrl}" target="_blank">📄</a>`
                                }</td>
                                <td style="${getMilesCellStyle(rowDataItem.distanceFromClinic)}">${rowDataItem.distanceFromClinic}</td>
                            `;

                            const detailsRow = document.createElement("tr");
                            detailsRow.classList.add("details-row");
                            detailsRow.style.display = "none";
                            detailsRow.id = `${rowUniqueId}-details`;
                            detailsRow.innerHTML = `<td colspan="15">${renderGenericDetails(incidente)}</td>`; // Colspan aumentado para 15

                            tableBody.appendChild(row);
                            tableBody.appendChild(detailsRow);

                        });
                    });
                });

                addCheckboxListenersToCurrentPage();
                updateSelectAllCheckboxState(); // Atualiza o estado do checkbox "selecionar todos"
                updateDownloadButton(); // Atualiza o contador no botão de download

                loadingDiv.style.display = "none";
                tableContainer.style.display = "block";

            } catch (error) {
                console.error('Erro ao carregar os dados:', error);
                loadingDiv.innerHTML = `<div style="color: red; text-align: center;">Erro ao carregar os dados. <br>(${error.message})</div>`;
                tableContainer.style.display = "none";
            }
        }
        
        function getMilesCellStyle(milesText) {
            if (typeof milesText !== "string" || milesText.trim() === "" || milesText.trim() === "--") {
                return ""; // sem cor para vazias ou "--"
            }

            const parts = milesText.split(":");
            if (parts.length < 2) return "";

            const miles = parseFloat(parts[1].replace(",", "."));
            if (isNaN(miles)) return "";

            if (miles <= 20) {
                return 'background-color: #d4edda;'; // Verde claro
            } else if (miles <= 30) {
                return 'background-color: #fff3cd;'; // Amarelo claro
            } else {
                return 'background-color: #f8d7da;'; // Vermelho claro
            }
        }


        function addCheckboxListenersToCurrentPage() {
            document.querySelectorAll('.row-checkbox').forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    const rowId = this.dataset.rowId;
                    // Encontra o item de dados correspondente em currentlyDisplayedData
                    const dataItem = currentlyDisplayedData.find(item => item.id === rowId);

                    if (!dataItem) {
                        console.warn("Data item não encontrado para o rowId:", rowId);
                        return;
                    }

                    if (this.checked) {
                        if (!selectedItemIds.has(rowId)) {
                            selectedItemIds.add(rowId);
                            selectedRowDataForExport.push(dataItem);
                        }
                    } else {
                        if (selectedItemIds.has(rowId)) {
                            selectedItemIds.delete(rowId);
                            selectedRowDataForExport = selectedRowDataForExport.filter(item => item.id !== rowId);
                        }
                    }
                    updateDownloadButton();
                    updateSelectAllCheckboxState(); // Atualiza o checkbox do cabeçalho
                });
            });
        }

        document.getElementById('select-all-current-page').addEventListener('change', function() {
            const isChecked = this.checked;
            document.querySelectorAll('.row-checkbox').forEach(checkbox => {
                // Apenas altera se o estado for diferente para evitar reprocessamento desnecessário
                if (checkbox.checked !== isChecked) {
                    checkbox.checked = isChecked;
                    // Dispara o evento 'change' para que a lógica de adicionar/remover seja executada
                    checkbox.dispatchEvent(new Event('change'));
                }
            });
        });

        function updateSelectAllCheckboxState() {
            const selectAllCheckbox = document.getElementById('select-all-current-page');
            const rowCheckboxes = document.querySelectorAll('.row-checkbox');
            if (rowCheckboxes.length === 0) {
                selectAllCheckbox.checked = false;
                selectAllCheckbox.indeterminate = false;
                return;
            }

            const allCheckedOnPage = Array.from(rowCheckboxes).every(cb => cb.checked);
            const someCheckedOnPage = Array.from(rowCheckboxes).some(cb => cb.checked);

            selectAllCheckbox.checked = allCheckedOnPage;
            selectAllCheckbox.indeterminate = !allCheckedOnPage && someCheckedOnPage;
        }


        function updateDownloadButton() {
            const button = document.getElementById('download-csv-button');
            const count = selectedRowDataForExport.length;
            button.textContent = `Selected Reports (${count})`;
            button.disabled = count === 0;
        }

        function nextPage() {
            currentPage++;
            fetchData();
        }

        function previousPage() {
            if (currentPage > 1) {
                currentPage--;
                fetchData();
            }
        }

        const inputElement = document.getElementById("sendToChat");

        if (inputElement) {
            inputElement.addEventListener("keypress", function(event) {
                if (event.key === "Enter") {
                    sendToChat(inputElement.value, window.g_wa_instance);
                }
            });
        }

        function sendToChat(message, instance) {
            if (instance && instance.send) {
                instance.send({ input: { text: message } });
            } else {
                console.warn("Instância do chat não disponível ou inválida.");
            }
        }

        document.addEventListener("click", function(e) {
            if (e.target && e.target.classList.contains("sendReportToChat")) {
                const reportNumber = e.target.getAttribute("data-id");
                if (window.g_wa_instance) {
                    sendToChat(`Report N°: ${reportNumber}`, window.g_wa_instance);
                } else {
                    console.warn("Erro ao carregar a instância do Watson Assistant.");
                }
            }
        });


        function populateStateSelect() {
            const select = document.getElementById('filter-state');
            select.innerHTML = '<option value="">All States</option>';
            states.forEach(({ name, abbr }) => {
                const option = document.createElement('option');
                option.value = abbr;
                option.textContent = `${abbr} - ${name}`;
                select.appendChild(option);
            });
        }

        function getFullStateName(abbrOrName) {
            const found = states.find(
                s => s.abbr.toLowerCase() === abbrOrName?.toLowerCase() || s.name.toLowerCase() === abbrOrName?.toLowerCase()
            );
            return found ? `${found.abbr}` : abbrOrName || "--";
        }

        function toggleDetails(id, button) {
            const detailsRow = document.getElementById(id);
            const isVisible = detailsRow.style.display === "table-row";
            detailsRow.style.display = isVisible ? "none" : "table-row";
            button.textContent = isVisible ? "▶" : "▼";
        }

        function renderGenericDetails(incident) {
            const city = incident.city || '';
            const state = incident.state || '';
            const dateTime = incident.accident_datetime ? new Date(incident.accident_datetime).toLocaleString() : 'N/A';
            const numberOfVehicles = Array.isArray(incident.vehicles) ? incident.vehicles.length : 0;

            let html = `
                <div class="incident-details">
                    <h3>Accident Details - ${incident.report_number || '--'}</h3>
                    <div class="general-info">
                        <p><strong>Date & Time:</strong> ${dateTime}</p>
                        <p><strong>Location:</strong> ${incident.street || '--'}, ${city}, ${state}</p>
                        ${incident.weather_condition ? `<p><strong>Weather:</strong> ${incident.weather_condition}</p>` : ''}
                        ${incident.road_condition ? `<p><strong>Road Condition:</strong> ${incident.road_condition}</p>` : ''}
                        ${incident.crash_severity ? `<p><strong>Severity:</strong> ${incident.crash_severity}</p>` : ''}
                        ${incident.narrative ? `<p><strong>Narrative:</strong> ${incident.narrative}</p>` : ''}
                        ${incident.notes ? `<p><strong>Notes:</strong> ${incident.notes}</p>` : ''}
                    </div>
            `;

            if (numberOfVehicles > 0) {
                html += `
                    <div class="vehicles-section">
                        <h4>People Involved (${numberOfVehicles} vehicle${numberOfVehicles > 1 ? 's' : ''})</h4>
                `;

                incident.vehicles.forEach((vehicle, idx) => {
                    const driverName = [vehicle.driver_first_name, vehicle.driver_middle_name, vehicle.driver_last_name]
                        .filter(Boolean).join(" ") || vehicle.driver_name || "--";

                    html += `<p><strong>Vehicle ${idx + 1} - Driver:</strong> ${driverName}</p>`;

                    const passengers = vehicle.passengers?.length ? vehicle.passengers : [];

                    if (passengers.length > 0) {
                        html += `<ul>`;
                        passengers.forEach((passenger, pIdx) => {
                            const passengerName = [passenger.first_name, passenger.middle_name, passenger.last_name]
                                .filter(Boolean).join(" ") || passenger.name || "--";
                            const age = passenger.age || "--";
                            const gender = passenger.gender || "--";
                            html += `<li>${passengerName} - Age: ${age}, Gender: ${gender}</li>`;
                        });
                        html += `</ul>`;
                    }
                });

                html += `</div>`;
            }

            html += `</div>`;
            return html;
        }

        function downloadSelectedCSV() {
            if (selectedRowDataForExport.length === 0) {
                alert("Nenhum item selecionado para download.");
                return;
            }

            const headers = [
                "Report N°", "Crash Date", "Driver Name", "Phone N°",
                "Insurance Details", "Crash Severity", "Age", "Gender",
                "Address", "State", "City", "Report PDF Link", "Distance from Clinic"
            ];

            // As chaves devem corresponder exatamente às propriedades do objeto rowDataItem
            const dataKeys = [
                "reportNumber", "crashDate", "driverName", "phone",
                "insuranceDetails", "crashSeverity", "age", "gender",
                "address", "state", "city", "reportPDFUrl", "distanceFromClinic"
            ];

            const DELIMITER = ';'; // Alterado para ponto e vírgula

            // Adiciona o BOM UTF-8 para melhor compatibilidade com Excel
            let csvContent = "\ufeff"; 

            csvContent += headers.map(header => {
                let cleanHeader = String(header).replace(/"/g, '""'); // Escapa aspas duplas
                return `"${cleanHeader}"`; // Envolve com aspas duplas
            }).join(DELIMITER) + "\r\n";

            selectedRowDataForExport.forEach(item => {
                const row = dataKeys.map(key => {
                    let val = item[key] !== undefined && item[key] !== null ? String(item[key]) : "";
                    
                    // Remove/substitui tabulações e quebras de linha de dentro dos campos
                    // para evitar problemas de formatação, mesmo quando o campo está entre aspas.
                    val = val.replace(/\t/g, ' '); // Substitui tabulação por espaço
                    val = val.replace(/\n/g, ' '); // Substitui nova linha por espaço
                    val = val.replace(/\r/g, ' '); // Substitui carriage return por espaço

                    val = `"${val.replace(/"/g, '""')}"`; // Escapa aspas duplas internas e envolve o valor com aspas duplas
                    return val;
                });
                csvContent += row.join(DELIMITER) + "\r\n";
            });

            // Usar Blob para criar o arquivo é mais robusto
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);

            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "Crash_Report_Data.csv");
            document.body.appendChild(link); // Necessário para Firefox

            link.click();

            document.body.removeChild(link); // Limpa o link
            URL.revokeObjectURL(url); // Libera o objeto URL
        }

        document.addEventListener('DOMContentLoaded', () => {
            populateStateSelect();
            fetchData();
            updateDownloadButton(); // Inicializa o estado do botão
        });
    </script>
